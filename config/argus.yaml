# ARGUS runtime configuration.
# Copied to /opt/argus/config/argus.yaml by setup_jetson.sh. Edit there on-device.
# Only override what you need; anything omitted uses the dataclass defaults in
# argus/config.py.

camera:
  # Smart discovery (default): cameras are identified by V4L2 device name and
  # left/right are re-bound to the physical cameras recorded at calibration
  # time (USB port paths), so indices surviving a reboot don't matter.
  #
  # The name hints must match what YOUR units actually report — always verify
  # with `v4l2-ctl --list-devices` before trusting these. On the reference rig
  # (Arducam AR0234 + IMX477P modules) the driver reports the Arducam MODULE
  # part number, not the sensor name: "AR0234"/"IMX477" never appear.
  #   Arducam B0495 (USB3 2.3MP)  x2  <- the AR0234 stereo pair
  #   Arducam B0459 (USB3 12MP)   x1  <- the IMX477P wide camera
  auto_detect: true
  stereo_name_hint: "B0495"    # substring of the stereo cams' V4L2 name
  wide_name_hint: "B0459"      # substring of the wide cam's V4L2 name
  # Stable physical mount binding for this prototype. Device numbers can change
  # after every reconnect; USB port paths do not unless cables are moved.
  left_usb_port: "2-1.1"
  right_usb_port: "2-1.2"
  wide_usb_port: "2-1.4"
  # Fallback / manual override (used when auto_detect is false or inconclusive).
  left_index: 0                # confirm with: v4l2-ctl --list-devices
  right_index: 2
  wide_index: 4
  # All three mounted modules advertise YUYV only. The AR0234 boards are
  # physically rotated in opposite directions on the glasses frame.
  pixel_format: "YUYV"
  stereo_width: 960
  stereo_height: 600
  stereo_fps: 30
  wide_width: 1920
  wide_height: 1080
  wide_fps: 30
  left_rotation: 90       # /dev/video0: normalize 90° clockwise
  right_rotation: 270     # /dev/video2: normalize 90° counterclockwise
  wide_rotation: 0
  reconnect: true              # reopen a camera that stops delivering frames

depth:
  backend: raft_trt      # production requires TensorRT/CUDA depth
  allow_cpu_fallback: false
  num_disparities: 128
  block_size: 5
  fast_downscale: 2      # SGBM matches at 1/N resolution so the 10 Hz loop holds rate
  baseline_m: 0.06       # fallback only — the calibration file overrides these
  focal_px: 700.0

safety:
  warn_distance_m: 1.5
  danger_distance_m: 0.7
  obstacle_percentile: 5.0     # robust "nearest obstacle" statistic (not a raw min)
  floor_drop_invalid_fraction: 0.75
  drop_far_m: 3.0
  tick_hz: 10.0
  danger_repeat_s: 2.0
  warn_repeat_s: 6.0

grounding:
  backend: trt
  allow_torch_fallback: false
  conf_threshold: 0.25
  imgsz: 640

agent:
  server_url: "http://127.0.0.1:8080"
  ctx_size: 2048
  max_tokens: 48        # one concise spoken sentence; avoids 256-token runaway
  temperature: 0.3
  request_timeout_s: 90.0
  retries: 0            # do not repeat a long CPU-bound request after timeout
  tool_protocol: prompt  # "prompt" works with every llama.cpp template; "native"
                         # needs --jinja + a tool-capable chat template
  image_max_side: 256    # warm-cache 6.4 s; cold production path measured 25.6 s

speech:
  wake_model: "hey_jarvis"  # openWakeWord built-in; replace with custom "ARGUS" .onnx later
  wake_threshold: 0.5
  whisper_model: "tiny"
  whisper_compute: "int8"
  record_seconds: 5.0
  input_device: null     # mic: index or name substring (e.g. "USB"); null = default
  output_device: null    # speaker/bone-conduction: index or name substring

privacy:
  face_model: "buffalo_s"
  det_size: 640
  blur_kernel: 51
  enable_text_blur: false
  require_gate: true     # HARD RULE: never call the agent if face blur is unavailable
